apiVersion: apps/v1
kind: Deployment
metadata:
  name: novacloud-api-gateway
  labels:
    app.kubernetes.io/name: novacloud-api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: novacloud-api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novacloud-api-gateway
    spec:
      containers:
        - name: caddy
          image: caddy:2.8-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
      volumes:
        - name: caddyfile
          configMap:
            name: novacloud-api-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: novacloud-api-gateway
spec:
  selector:
    app.kubernetes.io/name: novacloud-api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
